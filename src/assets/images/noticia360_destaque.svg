<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f2648" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background with subtle news grid -->
  <rect width="800" height="400" fill="url(#bgGrad)" />
  <rect width="800" height="400" fill="url(#grid)" />
  
  <!-- Modern Tech / Globe Circles Glow -->
  <circle cx="400" cy="200" r="160" fill="url(#glow)" />
  <circle cx="400" cy="200" r="140" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="400" cy="200" r="180" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4 8" opacity="0.3" />

  <!-- Digital Accent Nodes -->
  <circle cx="260" cy="200" r="4" fill="#60a5fa" />
  <circle cx="540" cy="200" r="4" fill="#ef4444" />
  <line x1="260" y1="200" x2="310" y2="200" stroke="#60a5fa" stroke-width="1.5" opacity="0.6" />
  <line x1="490" y1="200" x2="540" y2="200" stroke="#ef4444" stroke-width="1.5" opacity="0.6" />

  <!-- Main Logo: Notícia360 -->
  <g transform="translate(400, 195)">
    <text text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="68" letter-spacing="-1">
      <tspan fill="#ffffff">Notícia</tspan><tspan fill="#ef4444">360</tspan>
    </text>
  </g>

  <!-- Slogan Badge -->
  <g transform="translate(400, 245)">
    <rect x="-170" y="-14" width="340" height="28" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="1.2">
      INFORMAÇÃO RÁPIDA • O MUNDO EM FOCO
    </text>
  </g>

  <!-- Live Speed Indicator -->
  <g transform="translate(400, 310)">
    <rect x="-95" y="-12" width="190" height="24" rx="12" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="1" />
    <circle cx="-75" cy="0" r="4" fill="#10b981" />
    <text text-anchor="middle" x="8" y="4" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#34d399">
      DESTAQUE PRINCIPAL
    </text>
  </g>
</svg>
